[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "insightron"
version = "4.1.1"
description = "AI-powered audio transcription with Whisper (GUI + CLI)"
readme = "README.md"
requires-python = ">=3.10,<3.15"
authors = [{ name = "Insightron Team" }]

dependencies = [
  "faster-whisper>=1.2.1,<2.0.0",
  "tokenizers>=0.23.1,<1.0.0",
  "librosa>=0.11.0,<1.0.0",
  "soundfile>=0.13.1,<1.0.0",
  "noisereduce>=3.0.3,<4.0.0",
  "pyloudnorm>=0.2.0,<1.0.0",
  "tqdm>=4.67.0",
  "pydub>=0.25.1",
  "numpy>=2.2.0,<3.0.0; python_version < '3.14'",
  "numpy>=2.3.0,<3.0.0; python_version >= '3.14'",
  "scipy>=1.15.0,<2.0.0; python_version < '3.14'",
  "scipy>=1.16.0,<2.0.0; python_version >= '3.14'",
  "matplotlib>=3.10.0,<4.0.0",
  "colorama>=0.4.6",
  "customtkinter>=5.2.2,<6.0.0",
  "packaging>=25.0",
  "sounddevice>=0.5.5,<1.0.0",
  "psutil>=7.0.0,<8.0.0; python_version >= '3.14'",
  "psutil>=5.9.8,<8.0.0; python_version < '3.14'",
  "PyYAML>=6.0.3,<7.0.0",
]

[project.optional-dependencies]
llm = [
  "transformers>=5.0.0,<6.0.0; python_version >= '3.14'",
  "transformers>=4.57.0,<6.0.0; python_version < '3.14'",
  "torch>=2.12.0,<3.0.0; python_version >= '3.14'",
  "torch>=2.9.0,<3.0.0; python_version < '3.14'",
  "accelerate>=1.11.0,<2.0.0",
  "openai>=2.0.0,<3.0.0",
  "huggingface_hub>=1.0.0,<2.0.0",
  "bitsandbytes>=0.43.0; platform_system != 'Windows'",
]
diarization = [
  "pyannote.audio>=4.0.0,<5.0.0; python_version >= '3.14'",
  "pyannote.audio>=3.4.0,<5.0.0; python_version < '3.14'",
  "torchaudio>=2.11.0,<3.0.0; python_version >= '3.14'",
  "torchaudio>=2.9.0,<3.0.0; python_version < '3.14'",
]
dev = [
  "pytest>=8.4.0,<9.0.0",
  "ruff>=0.14.0,<1.0.0",
]

[project.scripts]
insightron = "insightron.app.main:main"
insightron-cli = "insightron.app.cli.cli:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["insightron*"]
