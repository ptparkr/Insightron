[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "insightron"
version = "4.0.0"
description = "AI-powered audio transcription with Whisper (GUI + CLI)"
readme = "README.md"
requires-python = ">=3.10,<3.13"
authors = [{ name = "Insightron Team" }]

dependencies = [
  "faster-whisper>=1.2.0,<2.0.0",
  "tokenizers>=0.19.1,<1.0.0",
  "librosa>=0.10.1,<1.0.0",
  "soundfile>=0.12.1,<1.0.0",
  "tqdm>=4.66.0",
  "pydub>=0.25.1",
  "numpy>=1.24.0,<1.27.0",
  "scipy>=1.10.0,<2.0.0",
  "matplotlib>=3.5.0",
  "colorama>=0.4.6",
  "customtkinter>=5.2.0,<6.0.0",
  "packaging>=23.0,<25.0",
  "sounddevice>=0.4.6",
  "psutil>=5.9.0",
  "PyYAML>=6.0,<7.0",
]

[project.optional-dependencies]
llm = [
  "transformers>=4.40.0",
  "torch>=2.0.0",
  "accelerate>=0.28.0",
  "openai>=1.0.0",
  "huggingface_hub>=0.20.0",
  "bitsandbytes>=0.43.0; platform_system != 'Windows'",
]
dev = [
  "pytest>=7.0.0",
  "ruff>=0.4.0",
]

[project.scripts]
insightron = "insightron.app.main:main"
insightron-cli = "insightron.app.cli.cli:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["insightron*"]
